databases:
  - name: attendance-db
    databaseName: attendance
    user: attendance_user
    plan: free

services:
  - type: web
    name: attendance-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # After deploying frontend to Vercel, update this to your real Vercel URL.
      # Accepts comma-separated list e.g.: https://my-app.vercel.app,https://my-app-preview.vercel.app
      - key: BACKEND_CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: UPLOAD_DIR
        value: /app/uploads
    healthCheckPath: /health
